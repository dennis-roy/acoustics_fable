{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:520px">
<h1>Change password</h1>
{% if user['must_change_password'] %}<p>This password must be changed before you continue.</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Current password</label><input name="current" type="password" autocomplete="current-password" required>
  <label>New password</label><input name="new" type="password" autocomplete="new-password" required>
  <label>New password again</label><input name="repeat" type="password" autocomplete="new-password" required>
  <p class="muted">At least 8 characters, with a letter and a digit, not containing the user name.</p>
  <p><button>Change</button></p>
</form>
</div>
{% endblock %}
