{% extends "base.html" %}
{% block body %}
<h1>Shifts <span class="muted">local time of this computer</span></h1>
<div class="card"><form method="post" class="row"><input type="hidden" name="csrf" value="{{ csrf }}">
  <input name="name" placeholder="Name, for example A" required style="max-width:200px">
  <input name="start" placeholder="Start HH:MM" required style="max-width:150px">
  <input name="end" placeholder="End HH:MM" required style="max-width:150px"><button>Add</button></form>
  <p class="muted">A shift that ends before it starts runs over midnight.</p></div>
<table><tr><th>Shift</th><th>Start</th><th>End</th><th></th></tr>{% for s in shifts %}
<tr><td>{{ s['name'] }}</td><td>{{ s['start_local'] }}</td><td>{{ s['end_local'] }}</td><td><form method="post">
<input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="delete" value="{{ s['id'] }}"><button class="small danger">Remove</button></form></td></tr>
{% else %}<tr><td class="muted" colspan="4">No shifts yet.</td></tr>{% endfor %}</table>
{% endblock %}
