<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EOL test stand{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a href="{{ url_for('home') }}">EOL test stand</a>
  <span class="muted" style="color:#c9d6ea">{{ station }}</span>
  <span class="grow"></span>
  {% if user %}
    <span>{{ user['username'] }} ({{ user['role'] }})</span>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="small secondary">Log out</button></form>
  {% endif %}
</header>
<main>
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  {% block body %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
